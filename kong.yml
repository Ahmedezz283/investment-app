_format_version: "3.0"
_transform: true

services:
  - name: investment-backend
    url: http://host.docker.internal:3000
    routes:
      - name: investment-backend-catch-all
        paths:
          - /
        strip_path: false

plugins:
  - name: rate-limiting
    config:
      minute: 5
      limit_by: ip
      policy: local
      fault_tolerant: true