services:

  postgres:
    image: postgres:16
    container_name: project-manager-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ahmadezz@2005
      POSTGRES_DB: investment_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d investment_db"]
      interval: 5s
      timeout: 5s
      retries: 10

