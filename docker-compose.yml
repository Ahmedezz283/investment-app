services:

  postgres:
    image: postgres:16
    container_name: project-manager-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ahmadezz@2005
      POSTGRES_DB: investment_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  jasper-db:
   image: postgres:16
   container_name: project-manager-jasper-db
   environment:
     POSTGRES_USER: jasper
     POSTGRES_PASSWORD: jasper_password
   ports:
     - "5434:5432"
   volumes:
     - jasper_db_data_v2:/var/lib/postgresql/data
   networks:
     - app-network
   healthcheck:
     test: ["CMD-SHELL", "pg_isready -U jasper"]
     interval: 5s
     timeout: 5s
     retries: 10

  jasperserver-init:
    image: agois/jasperserver-ce-init:7.8.0
    container_name: project-manager-jasperserver-init
    environment:
      DB_HOST: jasper-db
      DB_USER: jasper
      DB_PASSWORD: jasper_password
      DB_PORT: 5432
      DB_NAME: jasperserver
      POSTGRES_USER: jasper
      POSTGRES_PASSWORD: jasper_password
      JRS_DBCONFIG_REGEN: "true"
    depends_on:
      jasper-db:
        condition: service_healthy
    volumes:
      - jasper_init_home:/usr/local/share/jasperserver
      - jasper_keystore:/usr/local/share/jasperserver/keystore
    command:
      [
        "/wait-for-it.sh",
        "jasper-db:5432",
        "-t",
        "60",
        "--",
        "/entrypoint-cmdline-ce.sh",
        "init"
      ]
    networks:
      - app-network

  jasperserver:
    image: agois/jasperserver-ce:7.8.0
    container_name: project-manager-jasperserver
    ports:
      - "8083:8080"
      - "8445:8443"
    environment:
      DB_HOST: jasper-db
      DB_USER: jasper
      DB_PASSWORD: jasper_password
      DB_PORT: 5432
      DB_NAME: jasperserver
    depends_on:
      jasper-db:
        condition: service_healthy
      jasperserver-init:
        condition: service_completed_successfully
    volumes:
      - jasper_webapp:/usr/local/tomcat/webapps/jasperserver
      - jasper_init_home:/usr/local/share/jasperserver
      - jasper_license:/usr/local/share/jasperserver/license
      - jasper_keystore:/usr/local/share/jasperserver/keystore
      - jasper_customization:/usr/local/share/jasperserver/customization
    command: ["/entrypoint-ce.sh", "run"]
    restart: unless-stopped
    networks:
      - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: project-manager-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    command: start-dev
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - app-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: project-manager-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/2181"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: project-manager-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
    depends_on:
      - zookeeper
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: project-manager-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - app-network

  flowable:
    image: flowable/all-in-one
    container_name: project-manager-flowable
    ports:
      - "8080:8080"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FLOWABLE_EVENTREGISTRY_KAFKA_SERVERS: kafka:29092
    volumes:
      - flowable_data:/opt/tomcat/flowable-db
    depends_on:
      - flowable-data-init
      - kafka
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  flowable-data-init:
    image: flowable/all-in-one
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["chown -R 1000:1000 /opt/tomcat/flowable-db"]
    volumes:
      - flowable_data:/opt/tomcat/flowable-db

  kong:
    image: kong:latest
    container_name: project-manager-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PLUGINS: "bundled"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
    volumes:
      - ./kong.yml:/etc/kong/kong.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - keycloak
    networks:
      - app-network

volumes:
  flowable_data:
  postgres_data:
  keycloak_data:
  jasper_db_data:
  jasper_db_data_v2:
  jasper_init_home:
  jasper_home:
  jasper_webapp:
  jasper_license:
  jasper_keystore:
  jasper_customization:

networks:
  app-network:
    driver: bridge